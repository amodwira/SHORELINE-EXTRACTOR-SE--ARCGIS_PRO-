<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1378" viewBox="0 0 1000 1378" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333333"/></marker></defs><rect width="1000" height="1378" fill="#ffffff"/><rect x="430.0" y="12.0" width="140" height="36" rx="18.0" fill="#E6E6E6" stroke="#333333" stroke-width="1.5"/><text x="500" y="35.2" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Start</text><path d="M500 48 V58" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="16" y="60" width="968" height="100" rx="10" fill="none" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="7 5"/><text x="30" y="80" font-size="14.5" font-weight="bold" fill="#4a4a4a">Inputs</text><polygon points="58.0,92.0 260.0,92.0 242.0,148.0 40.0,148.0" fill="#D9EDD3" stroke="#333333" stroke-width="1.5"/><text x="150" y="115.9" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Sentinel-2 composite</text><text x="150" y="134.6" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">B3, B4, B8, B11</text><polygon points="293.0,92.0 495.0,92.0 477.0,148.0 275.0,148.0" fill="#D9EDD3" stroke="#333333" stroke-width="1.5"/><text x="385" y="115.9" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Lidar DEM</text><text x="385" y="134.6" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">1 m, NAVD88</text><polygon points="528.0,92.0 730.0,92.0 712.0,148.0 510.0,148.0" fill="#D9EDD3" stroke="#333333" stroke-width="1.5"/><text x="620" y="115.9" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">MHW elevation</text><text x="620" y="134.6" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">NOAA station / VDatum</text><polygon points="763.0,92.0 965.0,92.0 947.0,148.0 745.0,148.0" fill="#D9EDD3" stroke="#333333" stroke-width="1.5"/><text x="855" y="115.9" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Study area</text><text x="855" y="134.6" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">(optional)</text><path d="M253 160 V204" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><path d="M747 160 V200" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="16" y="172" width="474" height="180" rx="10" fill="none" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="7 5"/><text x="30" y="192" font-size="14.5" font-weight="bold" fill="#4a4a4a">A  Spectral classification</text><rect x="33.0" y="206.0" width="440" height="52" rx="3" fill="#D6E6F5" stroke="#333333" stroke-width="1.5"/><text x="253" y="227.9" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Compute MNDWI (B3, B11) and NDVI</text><text x="253" y="246.6" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">(B4, B8) on one 10 m reference grid</text><path d="M253 258 V280" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/><rect x="33.0" y="282.0" width="440" height="52" rx="3" fill="#D6E6F5" stroke="#333333" stroke-width="1.5"/><text x="253" y="303.9" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Gaussian smoothing (σ = 1 px) and</text><text x="253" y="322.6" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Otsu threshold → spectral water / land</text><rect x="510" y="172" width="474" height="180" rx="10" fill="none" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="7 5"/><text x="524" y="192" font-size="14.5" font-weight="bold" fill="#4a4a4a">B  Lidar preparation</text><polygon points="747,200.0 847.0,230 747,260.0 647.0,230" fill="#FCEFC2" stroke="#333333" stroke-width="1.5"/><text x="747" y="235.1" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#1a1